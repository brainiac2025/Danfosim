[project]
name = "danfosim"
version = "0.1.0"
description = "Agent-based simulation of Lagos informal transit (danfo/keke) vs. formal fixed-route transit"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["danfosim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
